[package]
name = "secretfolder"
version = "0.1.5"
description = "Encrypted local file vault for Windows — folder feel, secrets safe at rest"
authors = ["Ahmi Darrow"]
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/AhmiDarrow/SecretFolder"

[lib]
name = "secretfolder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
rand = "0.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
mime_guess = "2"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = "2"

[dev-dependencies]
tempfile = "3"
